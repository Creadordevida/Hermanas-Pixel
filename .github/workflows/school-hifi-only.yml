name: Colegio arte aprobado - integrar PNG y verificar Flutter SIN APK
# This workflow NEVER builds Android. Trigger only by the approved ZIP upload.
on:
  push:
    branches:
      - work/revision-visual-20261028-continuidad
    paths:
      - qa/school_inbox/COLEGIO_REFERENCIA_EXACTA_27_PANELES_Y_VENTANAS_MOVILES.zip
      - .github/trigger-school-hifi-qa.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-hifi-asset-only
  cancel-in-progress: false

jobs:
  integrate-school-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout rama exacta PR5
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Flutter estable de referencia
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: PIL y numpy para comprobar arte real
        run: python3 -m pip install --user pillow numpy pyyaml
      - name: Verificar paquete original e importar 30 archivos binarios sin rediseñar
        shell: bash
        run: |
          set -euo pipefail
          ZIP=qa/school_inbox/COLEGIO_REFERENCIA_EXACTA_27_PANELES_Y_VENTANAS_MOVILES.zip
          test -s "$ZIP"
          python3 -m py_compile tools/import_school_exact_twc.py qa/check_school_hifi_twc.py
          python3 tools/import_school_exact_twc.py . "$ZIP"
      - name: Regenerar SOLO los paisajes escolares sin tocar recursos de enemigos
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_interiors_parallax_twc.py
      - name: Verificar hashes 27 PNG aprobados, master y suelo tras el generador escolar
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/check_school_hifi_twc.py --strict
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          z=zipfile.ZipFile('qa/school_inbox/COLEGIO_REFERENCIA_EXACTA_27_PANELES_Y_VENTANAS_MOVILES.zip')
          files=[
            'assets/images/school_hifi/school_five_scenes_master.png',
            'assets/images/ground/stage_6_hifi.png',
            'qa/school_hifi_lab/SCHOOL_HIFI_MANIFEST.json',
            *[f'assets/images/interiors_parallax/school/z{i}_panel_{j}.png'
              for i in range(3) for j in range(9)]
          ]
          for f in files:
              current=Path(f)
              if not current.exists() or hashlib.sha256(current.read_bytes()).digest()!=hashlib.sha256(z.read(f)).digest():
                  raise AssertionError('Approved asset changed or absent after regeneration: '+f)
          print('30/30 APPROVED BINARY FILES preserved EXACTLY')
          PY
      - name: Recuperar marcos y exterior original SOLO cambiando alpha de cristal
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preview_school_window_alpha.py
          python3 qa/check_school_hifi_twc.py --strict
      - name: Flutter package resolution (NO Android build)
        run: flutter pub get
      - name: Comprobar codigo Dart con arte definitivo (NO Android)
        run: flutter analyze --no-pub lib
      - name: Capturas REAL Flutter — cinco salas, dos transiciones, ambas hermanas y paralaje 20 a 9
        timeout-minutes: 11
        run: flutter test --reporter expanded --no-pub test/school_hifi_real_render_test.dart
      - name: Comprobar once capturas, ambas protagonistas y movimiento real del paisaje
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          import hashlib
          import numpy as np
          root=Path('qa/school_hifi_flutter')
          names=['01_pasillo','02_taquillas','03_biblioteca',
                 '04_aula_pupitres','05_informatica',
                 '06_paso_a_aula','07_paso_a_informatica',
                 '08_pasillo_movimiento_60','09_biblioteca_movimiento_60',
                 '10_sara_aula','11_sara_biblioteca']
          hashes=[]
          for name in names:
            f=root/(name+'.png')
            if not f.is_file() or f.stat().st_size<10000:
                raise AssertionError('Missing REAL Flutter screenshot '+str(f))
            with Image.open(f) as img:
                if img.size!=(1000,450):raise AssertionError('Wrong viewport '+name)
                rgb=img.convert('RGB')
                if sum(ImageStat.Stat(rgb).stddev)<18:
                    raise AssertionError('Blank or nearly empty screenshot '+name)
            hashes.append(hashlib.sha256(f.read_bytes()).hexdigest())
          if len(set(hashes))!=11:raise AssertionError('Repeated Flutter room screenshots')
          # A 60-world-pixel camera movement moves the physical school wall
          # 60px. Once the wall is aligned, authentic .30/.56 outdoor motion
          # must still be visible inside the window glass.
          for base,moved,wall,window in [
            ('01_pasillo','08_pasillo_movimiento_60',(210,315),(400,700)),
            ('03_biblioteca','09_biblioteca_movimiento_60',(85,165),(400,550)),
          ]:
            a=np.asarray(Image.open(root/(base+'.png')).convert('RGB'),dtype=np.int16)
            b=np.asarray(Image.open(root/(moved+'.png')).convert('RGB'),dtype=np.int16)
            x0,x1=wall
            fixed=float(np.abs(a[65:145,x0:x1]-b[65:145,x0-60:x1-60]).mean())
            x0,x1=window
            moving=float(np.abs(a[55:145,x0:x1]-b[55:145,x0-60:x1-60]).mean())
            print('REAL_WINDOW_MOTION',base,'wall=',round(fixed,2),'glass=',round(moving,2))
            if moving<=max(1.5,fixed+1.5):
              raise AssertionError('No visible exterior parallax behind glass: '+base)
          print('11 distinct ACTUAL Flutter StagePainter screenshots, two protagonists and real window parallax verified')
          PY
      - name: Commit SOLO arte aprobado y once capturas probadas, nunca APK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/revision-visual-20261028-continuidad"
          git config user.name "twc-school-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/school_hifi/school_five_scenes_master.png
          git add assets/images/ground/stage_6_hifi.png
          git add qa/school_hifi_lab/SCHOOL_HIFI_MANIFEST.json
          git add assets/images/interiors_parallax/school/z*_panel_*.png
          # The two authentic .30/.56 landscapes are generated from the
          # approved chapter-one masters above. Persist exactly what Flutter
          # rendered; otherwise a later Android build could use the old,
          # geometric placeholder landscapes still stored in the branch.
          git add assets/images/interiors_parallax/school/exterior_lejano_ciclo.png
          git add assets/images/interiors_parallax/school/arbolado_tras_ventanas_ciclo.png
          git add qa/school_hifi_flutter/*.png
          # Keep the one uploaded ZIP as provenance; deleting it here would
          # retrigger this paths-filtered workflow and cause a false failure.
          git diff --cached --check
          git commit -m "art(school): preserve approved pixels and verify 11 real Flutter screenshots"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Explicar estado final
        run: |
          echo "Render Flutter 20:9 verificado; prueba en dispositivo requiere una futura APK expresamente autorizada."
          echo "Este trabajo NO compila Android, NO fusiona PR y NO publica ninguna app."
