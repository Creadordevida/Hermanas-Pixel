name: Compilar Miren y Sara 0.9.0 RC8 - PRUEBAS DE TODAS LAS MEJORAS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk-candidato:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias auditoría
        run: python3 -m pip install --user pillow numpy
      - name: Integridad base 0.8.0 y de todos los assets de la candidata
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/verify_resources.py
          python3 qa/verify_layered_scenes.py
          python3 qa/verify_candidate_assets.py
          python3 qa/release_gate.py
          python3 qa/scene_metrics_vnext.py
          python3 -m unittest discover -s qa -p 'test_*.py'
      - name: Crear Android sin sobrescribir el juego
        run: flutter create --no-overwrite --platforms=android --project-name hermanas_aventura .
      - name: Instalar icono aprobado
        shell: bash
        run: |
          set -euo pipefail
          cp -R launcher/res/. android/app/src/main/res/
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Nombre del juego en Android
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/android:label="hermanas_aventura"/android:label="Miren y Sara"/' android/app/src/main/AndroidManifest.xml
      - name: Descargar dependencias del juego
        run: flutter pub get
      - name: Analizar Dart
        run: |
          flutter analyze --no-pub lib
          flutter analyze --no-pub test
      - name: Probar mecánicas, interfaz, saltos, sombras y carga de imágenes
        run: flutter test test/asset_integrity_test.dart test/dog_mechanics_test.dart test/wildlife_mechanics_test.dart test/jump_visuals_test.dart test/hero_hearts_test.dart test/widget_test.dart
      # El APK se compila ANTES de las capturas extensas. Si la revisión
      # visual falla, el flujo queda ROJO (sin un aprobado engañoso), pero
      # Henry conserva el APK para diagnosticar y probar en el móvil.
      - name: Construir APK Android de PRUEBA (sin aprobación artística)
        run: flutter build apk --release
      - name: Publicar APK de prueba en cuanto esté construido
        uses: actions/upload-artifact@v4
        with:
          name: Miren-y-Sara-0.9.0-RC8-APK-PRUEBAS
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Capturar mapa, capítulos, criaturas, saltos y sombras en Flutter
        id: captures
        run: flutter test test/qa_render_capture_test.dart test/qa_outfits_capture_test.dart test/qa_creature_render_test.dart test/qa_wildlife_render_test.dart test/qa_jump_render_test.dart
      - name: Comprobar 14 imágenes REALES del campo y escuela de danza
        run: python3 qa/check_activity_flutter_captures.py
      - name: Publicar capturas reales para revisión visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-REALES-Flutter-0.9.0-RC8
          path: qa/rendered_from_flutter/*.png
          if-no-files-found: warn
      - name: Informe de calidad exigente (no bloquea prueba manual)
        if: always()
        shell: bash
        run: |
          python3 qa/release_gate.py --strict > qa/RESULTADO_PUERTAS.txt || true
          printf '\nATENCION: ESTA VERSION ES UNA CANDIDATA PARA PROBAR, NO UNA VERSION ARTISTICA APROBADA.\n' >> qa/RESULTADO_PUERTAS.txt
      - name: Publicar informe de controles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Informe-QA-0.9.0-RC8
          path: |
            qa/RESULTADO_PUERTAS.txt
            qa/CANDIDATE_ASSET_INVENTORY.json
            qa/SCENE_SEAMS_REPORT.json
          if-no-files-found: warn
