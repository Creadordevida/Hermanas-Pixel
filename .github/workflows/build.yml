
name: Compilar Hermanas Pixel APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar contenido y recursos
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.yaml
          test -s lib/main.dart
          grep -q 'class StagePainter' lib/main.dart
          test -s assets/images/level_pixel.png
          test -s assets/images/crate.png
          test -s assets/images/coin.png
          for name in futbolista bailarina padre; do
            for pose in idle_0 walk_0 walk_1 jump_0; do
              test -s "assets/images/frames/${name}_${pose}.png"
            done
          done

      - name: Validación de PNG y poses diferentes
        run: python3 qa/verify_resources.py

      - name: Crear proyecto Android nativo (sin sobrescribir Dart)
        run: flutter create --no-overwrite --platforms=android --project-name hermanas_aventura .

      - name: Nombre visible en Android
        run: sed -i 's/android:label="hermanas_aventura"/android:label="Hermanas Pixel"/' android/app/src/main/AndroidManifest.xml

      - name: Descargar dependencias
        run: flutter pub get

      - name: Analizar codigo Dart
        run: flutter analyze --no-pub

      - name: Pruebas de recursos Flutter
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Hermanas-Pixel-0.7.0-Android
          path: build/app/outputs/flutter-apk/app-release.apk

