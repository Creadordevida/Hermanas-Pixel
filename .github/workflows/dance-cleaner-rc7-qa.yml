name: Dance cleaner RC7 real Flutter gameplay QA
on:
  push:
    branches:
      - work/revision-visual-20261028-continuidad
    paths:
      - lib/main.dart
      - lib/four_enemy_behaviors.dart
      - test/dance_cleaner_rc7_gameplay_test.dart
      - test/dance_cleaner_rc7_render_test.dart
      - test/dance_cleaner_rc7_release_test.dart
      - .github/workflows/dance-cleaner-rc7-qa.yml
  pull_request:
    paths:
      - lib/main.dart
      - lib/four_enemy_behaviors.dart
      - test/dance_cleaner_rc7_gameplay_test.dart
      - .github/workflows/dance-cleaner-rc7-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dance-cleaner-rc7-qa
  cancel-in-progress: false
jobs:
  flutter-cleaner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/main.dart lib/four_enemy_behaviors.dart test/four_enemy_behaviors_test.dart test/dance_cleaner_rc7_gameplay_test.dart test/dance_cleaner_rc7_release_test.dart
      - run: flutter test test/four_enemy_behaviors_test.dart
      - run: flutter test test/dance_cleaner_rc7_release_test.dart
      - run: flutter test --dart-define=TWC_GAMEPLAY_PLAYTEST=true test/dance_cleaner_rc7_gameplay_test.dart
      - name: Capture genuine cleaner StagePainter 20:9
        run: flutter test --dart-define=TWC_GAMEPLAY_PLAYTEST=true test/dance_cleaner_rc7_render_test.dart
      - name: Verify and preserve exact Flutter PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          files=sorted(Path('qa/dance_cleaner_flutter').glob('*.png'))
          assert len(files)==6, f'Expected 6 real Flutter captures, got {len(files)}'
          for p in files:
              b=p.read_bytes()
              assert b[:8]==bytes.fromhex('89504e470d0a1a0a'),str(p)
              assert unpack('>II',b[16:24])==(1000,450),str(p)
              assert len(b)>10000,str(p)
          print('CLEANER_REAL_STAGEPAINTER_PNG_PASS',len(files))
          PY
          # PR merge refs are for validation only; never push generated binaries from them.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then exit 0; fi
          git config user.name 'twc-cleaner-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/dance_cleaner_flutter/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'qa(rc7): preserve real cleaner StagePainter screenshot'
            git fetch origin work/revision-visual-20261028-continuidad
            git rebase origin/work/revision-visual-20261028-continuidad
            git push origin HEAD:work/revision-visual-20261028-continuidad
          fi
