name: Dance cleaner RC7 real Flutter gameplay QA
on:
  push:
    branches:
      - work/revision-visual-20261028-continuidad
    paths:
      - lib/main.dart
      - lib/four_enemy_behaviors.dart
      - test/dance_cleaner_rc7_gameplay_test.dart
      - .github/workflows/dance-cleaner-rc7-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dance-cleaner-rc7-qa
  cancel-in-progress: false
jobs:
  flutter-cleaner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/main.dart lib/four_enemy_behaviors.dart test/four_enemy_behaviors_test.dart test/dance_cleaner_rc7_gameplay_test.dart
      - run: flutter test test/four_enemy_behaviors_test.dart
      - run: flutter test --dart-define=TWC_GAMEPLAY_PLAYTEST=true test/dance_cleaner_rc7_gameplay_test.dart
