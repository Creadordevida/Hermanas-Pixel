name: Río Arga RC7 - QA Flutter 20:9 sin APK
# Ejecución manual de QA exclusivamente, sin compilación Android ni publicación.
# Repositorio público: runner Ubuntu estándar; usar con autorización del propietario.
on:
  workflow_dispatch:
  push:
    branches:
      - work/revision-visual-20261028-continuidad
    paths:
      - .github/arga-atlas-qa-once-20261108.txt
permissions:
  contents: write
concurrency:
  group: arga-rc7-real-qa
  cancel-in-progress: false
jobs:
  arga-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub lib
      - run: flutter test --no-pub --reporter expanded test/arga_platform_rules_test.dart test/arga_crossing_test.dart test/arga_boy_behavior_test.dart test/arga_stone_projectile_test.dart test/arga_trout_behavior_test.dart test/arga_sprite_atlas_test.dart
      - run: flutter test --no-pub --dart-define=TWC_ARGA_ATLAS_QA=true --reporter expanded test/arga_rc7_real_render_test.dart
      - run: flutter test --no-pub --dart-define=TWC_ARGA_ATLAS_QA=true --reporter expanded test/arga_crab_attack_frames_render_test.dart
      - run: flutter test --no-pub --dart-define=TWC_ARGA_ATLAS_QA=true --reporter expanded test/arga_fisher_cast_frames_render_test.dart
      - run: flutter test --no-pub --dart-define=TWC_ARGA_ATLAS_QA=true --reporter expanded test/arga_boy_throw_frames_render_test.dart
      - run: flutter test --no-pub --dart-define=TWC_ARGA_ATLAS_QA=true --reporter expanded test/arga_trout_leap_frames_render_test.dart
      - name: Verify eight authentic 20:9 frames
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          frames=sorted(Path('qa/arga_rc7_flutter').glob('qa_*.png'))
          assert len(frames)==8, frames
          for frame in frames:
              blob=frame.read_bytes()
              assert len(blob)>10000 and blob[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',blob[16:24])==(1000,450), frame
          print('Verified eight Arga StagePainter screenshots 1000x450')
          PY
      - name: Preserve real QA images (no APK)
        run: |
          git config user.name "twc-arga-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/arga_rc7_flutter/qa_*.png qa/arga_rc7_flutter/trout_leap_810.png qa/arga_rc7_flutter/crab_pinch_frame_*.png qa/arga_rc7_flutter/crab_pose_*.png qa/arga_rc7_flutter/fisher_cast_frame_*.png qa/arga_rc7_flutter/fisher_pose_*.png qa/arga_rc7_flutter/boy_throw_frame_*.png qa/arga_rc7_flutter/trout_pose_frame_*.png
          if ! git diff --cached --quiet; then
            git commit -m "qa(arga): preserve genuine Arga Flutter panoramas and trout leap"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
