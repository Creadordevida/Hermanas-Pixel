name: Goalkeeper original PNG history audit
on:
  workflow_dispatch:
  push:
    branches: [work/revision-visual-20261028-continuidad]
    paths: [tools/audit_goalkeeper_history.py, .github/workflows/goalkeeper-history-audit.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Search historical PNG versions without modifying originals
        run: python tools/audit_goalkeeper_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: goalkeeper-history-audit
          path: qa/goalkeeper_rebuild_20261109/history_audit.json
          retention-days: 7
