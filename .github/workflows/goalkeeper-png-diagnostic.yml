name: Goalkeeper damaged PNG diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - work/revision-visual-20261028-continuidad
    paths:
      - 'tools/diagnose_goalkeeper_pngs.py'
      - '.github/workflows/goalkeeper-png-diagnostic.yml'
  pull_request:
    paths:
      - 'tools/diagnose_goalkeeper_pngs.py'
      - '.github/workflows/goalkeeper-png-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Inspect all masters and recover diagnostic copies
        run: python tools/diagnose_goalkeeper_pngs.py
      - name: Upload diagnostics, never publish as game art
        uses: actions/upload-artifact@v4
        with:
          name: goalkeeper-png-diagnostic-unapproved
          path: qa/goalkeeper_rebuild_20261109/diagnostic_recovery/
          retention-days: 7
          if-no-files-found: error
