name: Slipper neighbor RC7 Flutter gameplay QA
on:
  push:
    branches:
      - work/revision-visual-20261028-continuidad
    paths:
      - lib/main.dart
      - lib/four_enemy_behaviors.dart
      - assets/images/enemies_new/slipper_neighbor_atlas.png
      - assets/images/enemies_new/green_slipper.png
      - test/slipper_neighbor_rc7_gameplay_test.dart
      - .github/workflows/slipper-neighbor-rc7-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-neighbor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/main.dart lib/four_enemy_behaviors.dart test/slipper_neighbor_rc7_gameplay_test.dart
      - run: flutter test --dart-define=TWC_GAMEPLAY_PLAYTEST=true test/slipper_neighbor_rc7_gameplay_test.dart
