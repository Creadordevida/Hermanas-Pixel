name: Miren Sara RC4 - APK de pruebas 6 enemigos
# One-shot authorized trigger file; all other pushes do NOT build.
# Pausado 2026-11-08 por solicitud del propietario: ejecución manual únicamente.
# No activar mientras GitHub Actions esté bloqueado por presupuesto.
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  playtest:
    name: Compilar 0.9.1 rc4 Android
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
      - name: Flutter estable fijado
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Dependencias imagen
        run: python3 -m pip install --user pillow numpy pyyaml
      - name: Regenerar dibujos desde originales sin sustituirlos
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_interiors_parallax_twc.py
          python3 tools/build_dance_panels_twc.py
          python3 tools/build_football_parallax_twc.py
          python3 tools/generate_new_enemy_sprites.py
          python3 tools/generate_navarre_king.py
          python3 tools/generate_estafeta_enemies.py
          python3 tools/refine_four_classic_enemies.py
          python3 tools/export_sprite_bounds.py
      - name: Comprobacion estricta recursos jugables y seis atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/playtest_091_asset_gate.py
          python3 -m unittest qa.test_dance_proportions
          python3 qa/check_new_enemy_artifacts.py
          python3 qa/check_four_classic_enemies.py
      - name: Crear plantilla Flutter para Android
        run: flutter create --no-overwrite --platforms=android --project-name hermanas_aventura .
      - name: Icono y nombre del videojuego
        shell: bash
        run: |
          set -euo pipefail
          cp -R launcher/res/. android/app/src/main/res/
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          sed -i 's/android:label="hermanas_aventura"/android:label="Miren y Sara"/' android/app/src/main/AndroidManifest.xml
      - name: Dependencias
        run: flutter pub get
      - name: Analisis de codigo Dart
        run: flutter analyze --no-pub lib
      - name: Probar IA colisiones animacion y titulo
        run: flutter test --no-pub test/new_enemy_behaviors_test.dart test/new_enemy_hitboxes_test.dart test/classic_enemy_pose_test.dart
      - name: Construir APK real con 6 enemigos provisionales
        timeout-minutes: 20
        run: flutter build apk --release --dart-define=TWC_GAMEPLAY_PLAYTEST=true
      - name: Comprobar APK de 0.9.1
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > qa/PLAYTEST_RC4_APK.sha256
      - name: Entregar APK como GitHub Release PRELIMINAR del repositorio privado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="playtest-0.9.1-rc4"
          APK=build/app/outputs/flutter-apk/app-release.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#Miren_y_Sara_0.9.1_RC4.apk" --clobber
            gh release upload "$TAG" qa/PLAYTEST_RC4_APK.sha256 qa/PLAYTEST_RC4_ASSETS.json --clobber
          else
            gh release create "$TAG" "$APK#Miren_y_Sara_0.9.1_RC4.apk" qa/PLAYTEST_RC4_APK.sha256 qa/PLAYTEST_RC4_ASSETS.json \
              --target "$GITHUB_SHA" \
              --title "0.9.1 RC4 - APK Android pruebas (seis enemigos)" \
              --notes "CANDIDATA PRIVADA PARA PRUEBAS EN MOVIL. Seis enemigos con arte provisional NO aprobado. PR 5 no fusionada. No apta para Google Play." \
              --prerelease
          fi
          gh release view "$TAG" --json url -q .url
