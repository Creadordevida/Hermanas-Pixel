name: Goalkeeper atlas candidate QA

on:
  workflow_dispatch:
  push:
    branches:
      - work/revision-visual-20261028-continuidad
    paths:
      - 'tools/build_goalkeeper_atlas.py'
      - 'qa/goalkeeper_rebuild_20261109/pose_*_rgba.png'
      - '.github/workflows/goalkeeper-atlas-candidate-qa.yml'
  pull_request:
    paths:
      - 'tools/build_goalkeeper_atlas.py'
      - 'qa/goalkeeper_rebuild_20261109/pose_*_rgba.png'
      - '.github/workflows/goalkeeper-atlas-candidate-qa.yml'

permissions:
  contents: read

jobs:
  atlas-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify all 24 preserved RGBA masters
        run: python qa/check_goalkeeper_master_poses.py
      - name: Build 4x6 candidate with shared scale
        run: python tools/build_goalkeeper_atlas.py
      - name: Check 24 cells, alpha and manifest
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, json
          root=Path('qa/goalkeeper_rebuild_20261109')
          path=root/'goalkeeper_atlas_4x6_candidate_rgba.png'
          manifest=json.loads((root/'goalkeeper_atlas_4x6_candidate_manifest.json').read_text())
          with Image.open(path) as atlas:
              assert atlas.mode=='RGBA' and atlas.size==(1024,1536)
              for r in range(6):
                  for c in range(4):
                      tile=atlas.crop((c*256,r*256,(c+1)*256,(r+1)*256))
                      assert tile.getchannel('A').getbbox(), (r,c)
                      assert tile.getpixel((0,0))[3]==0, (r,c)
          assert len(manifest['poses'])==24
          assert manifest['status']=='CANDIDATE_NOT_APPROVED'
          assert hashlib.sha256(path.read_bytes()).hexdigest()==manifest['atlas_sha256']
          print('GOALKEEPER_ATLAS_CANDIDATE_QA_PASS — not visual approval')
          PY
      - name: Upload candidate and traceability manifest
        uses: actions/upload-artifact@v4
        with:
          name: goalkeeper-atlas-4x6-candidate-not-approved
          path: |
            qa/goalkeeper_rebuild_20261109/goalkeeper_atlas_4x6_candidate_rgba.png
            qa/goalkeeper_rebuild_20261109/goalkeeper_atlas_4x6_candidate_manifest.json
          if-no-files-found: error
          retention-days: 7
